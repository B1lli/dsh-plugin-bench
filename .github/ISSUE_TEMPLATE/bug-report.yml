name: Bug report
description: Report a reproducible classifier, score, provenance, or renderer defect.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: supported-path
    attributes:
      label: Supported DSH path
      description: Link the official contract or real public artifact that reaches this behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal redacted reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed credentials, private URLs, and user data.
          required: true
